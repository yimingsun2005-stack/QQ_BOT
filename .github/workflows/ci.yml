name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Compile runtime and release tools
        run: python -m compileall -q -f *.py tools
      - name: Check configuration, behavior, archives and Linux lifecycle
        run: python tools/check_release.py
      - name: Build clean release archives
        run: python tools/build_release.py
